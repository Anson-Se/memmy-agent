name: Windows PPTX diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/office-pptx-diagnostic.yml"
      - "scripts/test-office-pptx-windows.mjs"
      - "scripts/office-pptx-thread-probe.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Provision pinned LibreOffice
        shell: pwsh
        run: |
          choco install libreoffice-fresh --version=26.2.6 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'LibreOffice installation failed' }
      - name: Install fixture dependencies
        run: npm ci --prefix plugins/office
      - name: Verify production converter with original and edited PPTX
        env:
          OFFICE_PPTX_THREAD_PROBE: "0"
          OFFICE_PPTX_DIAGNOSTICS: ${{ runner.temp }}/pptx-diagnostics
        run: node scripts/test-office-pptx-windows.mjs
      - name: Preserve full diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pptx-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pptx-diagnostics/
          if-no-files-found: error
